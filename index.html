<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ric0z</title>
  <meta name="description" content="Ric0z is building high-performance trading infrastructure for prediction markets.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a5fd6'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='19' font-weight='700' fill='white' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111418;
      --muted: #5f6368;
      --accent: #1a5fd6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0d10;
        --fg: #e8eaed;
        --muted: #9aa0a6;
        --accent: #6b9dff;
      }
    }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      max-width: 40rem;
      margin: 0 auto;
      padding: 2rem 1rem;
      box-sizing: border-box;
    }
    h1 {
      font-size: clamp(2.75rem, 9vw, 4.5rem);
      letter-spacing: -0.03em;
      margin: 0 0 1rem;
    }
    .tagline {
      font-size: clamp(1.2rem, 3.2vw, 1.5rem);
      line-height: 1.45;
      margin: 0 0 2.5rem;
    }
    .contact { margin: 0; color: var(--muted); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer {
      padding: 1.5rem 1rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Ric0z</h1>
    <p class="tagline">Building high-performance trading infrastructure for prediction markets.</p>
    <p class="contact">Contact: <a href="mailto:founders@ric0z.com">founders@ric0z.com</a></p>
  </main>
  <footer>&copy; 2026 Ric0z</footer>
</body>
</html>
