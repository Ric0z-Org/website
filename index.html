  <style>
    :root {
      color-scheme: light;
      --bg: #F1F7F2;
      --ink: #1E4D37;
      --brain: #D64A3E;
      --brain-dark: #B53A2F;
      --muted: #4A6B5A;
    }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      max-width: 40rem;
      margin: 0 auto;
      padding: 2rem 1rem;
      box-sizing: border-box;
    }
    h1 { margin: 0 0 2rem; line-height: 0; }
    h1 svg { display: block; width: clamp(220px, 62vw, 400px); height: auto; }
    .tagline {
      font-size: clamp(1.2rem, 3.2vw, 1.5rem);
      line-height: 1.45;
      margin: 0 0 2.5rem;
    }
    .contact { margin: 0; color: var(--muted); }
    a {
      color: var(--ink);
      text-decoration: underline;
      text-decoration-color: var(--brain);
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }
    a:hover { color: var(--brain-dark); }
    footer {
      padding: 1.5rem 1rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.875rem;
    }
  </style>
